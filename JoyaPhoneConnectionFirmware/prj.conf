# ==================================================
# GPIO CORE
# ==================================================
CONFIG_GPIO=y

# ==================================================
# UART
# ==================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ==================================================
# BLUETOOTH CORE
# ==================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Nombre base por defecto
CONFIG_BT_DEVICE_NAME="Joya"

# Habilitar la capacidad de cambiar el nombre dinámicamente
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32

# ==================================================
# FOR TESTING
# ==================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# For testing
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_BT_DEBUG_LOG=y

# ==================================================
# FOR FLASH STORAGE
# ==================================================

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y