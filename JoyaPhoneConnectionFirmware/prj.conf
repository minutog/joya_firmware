# ==================================================
# GPIO CORE
# ==================================================
CONFIG_GPIO=y

# ==================================================
# I2C CORE
# ==================================================
CONFIG_I2C=y


# ==================================================
# LOGGING
# ==================================================
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n


# ==================================================
# Stacks
# ==================================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096


# ==================================================
# BLUETOOTH CORE
# ==================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Nombre base por defecto
CONFIG_BT_DEVICE_NAME="Joya"

# Habilitar la capacidad de cambiar el nombre dinámicamente
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32

CONFIG_BT_MAX_CONN=1

# For debug
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=36      
# 45 ms - apple pide >= 15 ms, < 2 s (unidades de 1.25 ms)
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=72      
# 90 ms - apple pide <= 2 segundos
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4       
# apple pide <= 30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600     
# 6 s - apple pide entre 6 y 18 segundos (unidades de 10 ms)

# ==================================================
# MVP BOARD CLOCKS
# ==================================================
# The test board is the old MVP PCB, not an nRF52 DK. Do not assume the DK's
# 32.768 kHz crystal is present/usable; BLE may advertise but fail to connect
# if the controller is built for XTAL while the hardware runs without it.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=4000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=1
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==================================================
# FOR FLASH STORAGE
# ==================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
