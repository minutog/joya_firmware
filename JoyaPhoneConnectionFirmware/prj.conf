# ==================================================
# GPIO CORE
# ==================================================
CONFIG_GPIO=y

# ==================================================
# I2C CORE
# ==================================================
CONFIG_I2C=y


# ==================================================
# LOGGING
# ==================================================
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n


# ==================================================
# MANUAL SEGGER RTT DEBUG ONLY
# ==================================================
#CONFIG_USE_SEGGER_RTT=y
#CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y

# ==================================================
# Stacks
# ==================================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096


# ==================================================
# BLUETOOTH CORE
# ==================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Nombre base por defecto
CONFIG_BT_DEVICE_NAME="Joya"

# Habilitar la capacidad de cambiar el nombre dinámicamente
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32

CONFIG_BT_MAX_CONN=1

# For debug
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=36      
# 45 ms - apple pide >= 15 ms, < 2 s (unidades de 1.25 ms)
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=72      
# 90 ms - apple pide <= 2 segundos
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4       
# apple pide <= 30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600     
# 6 s - apple pide entre 6 y 18 segundos (unidades de 10 ms)

# ==================================================
# FOR FLASH STORAGE
# ==================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
